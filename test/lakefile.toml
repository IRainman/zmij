name = "zmij-verify"
defaultTargets = ["zmij"]

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "zmij"
srcDir = "."
roots = ["core", "yy", "zmij"]

# binary128's finite checks run for about ten minutes, so they are opt-in:
# `lake build yy128`. Absent from defaultTargets, `lake build` is unaffected.
[[lean_lib]]
name = "yy128"
srcDir = "."
roots = ["yy128"]

# The x87 80-bit checks are the same size and opt-in for the same reason:
# `lake build yy80`.
[[lean_lib]]
name = "yy80"
srcDir = "."
roots = ["yy80"]
