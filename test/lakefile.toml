name = "zmij-verify"
defaultTargets = ["Zmij"]

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "Zmij"
srcDir = "."
roots = ["Core", "YY", "Zmij"]

# binary128's finite checks run for about four minutes, so they are opt-in:
# `lake build YY128`. Absent from defaultTargets, `lake build` is unaffected.
[[lean_lib]]
name = "YY128"
srcDir = "."
roots = ["YY128"]

# The x87 80-bit checks are the same size and opt-in for the same reason:
# `lake build YY80`.
[[lean_lib]]
name = "YY80"
srcDir = "."
roots = ["YY80"]

# The fixed-precision certificates sweep every (exponent, precision) pair, so
# they are opt-in as well: `lake build ZmijPrecision`.
[[lean_lib]]
name = "ZmijPrecision"
srcDir = "."
roots = ["ZmijPrecision"]
